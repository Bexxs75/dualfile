[package]
name = "dualfile-core"
description = "Dualfile core: virtual file system, operations, jobs, settings (no UI dependencies)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process"] }
trash = "5"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "bzip2"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
crc32fast = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }
sevenz-rust2 = "0.23"
sha2 = "0.11"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[dev-dependencies]
tempfile = "3"
