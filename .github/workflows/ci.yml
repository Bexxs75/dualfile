name: CI
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # No rust-toolchain or rust-version is declared in this repository yet.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo build --workspace --examples      # plain runnable askpass_helper the askpass test exec()s
      - run: cargo test --workspace
      # src-tauri deliberately has its own workspace.
      - name: Check Tauri workspace
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings
          cargo test --workspace
      - run: python3 scripts/test_make_latest_json.py
      - run: python3 scripts/test_changelog_notes.py
