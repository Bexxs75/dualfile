name: Linux draft release
'on':
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # Refuse to build unless the tagged commit is green in CI and the release
  # metadata is complete. Mirrors scripts/release-preflight.sh (pre).
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: CI must be green on exactly this commit
        run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json status,conclusion -q '.[] | "\(.status):\(.conclusion)"')
          echo "ci.yml runs on $GITHUB_SHA: ${runs:-none}"
          if ! grep -qx 'completed:success' <<<"$runs"; then
            echo "::error::ci.yml has no successful run on $GITHUB_SHA; refusing to build."
            exit 1
          fi
      - name: Check version in all files, CHANGELOG and release notes
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          tag = os.environ['RELEASE_TAG']
          errors = []
          if not re.fullmatch(r'v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?', tag):
              sys.exit(f'Tag {tag!r} is not vX.Y.Z')
          version = tag[1:]
          def read(path):
              return open(path, encoding='utf-8').read()
          def check(label, found):
              if found != version:
                  errors.append(f'{label}: {found!r}, expected {version!r}')
          check('src-tauri/tauri.conf.json', json.load(open('src-tauri/tauri.conf.json'))['version'])
          m = re.search(r'\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"', read('Cargo.toml'), re.M | re.S)
          check('Cargo.toml [workspace.package]', m and m.group(1))
          m = re.search(r'\[package\][^\[]*?^version\s*=\s*"([^"]+)"', read('src-tauri/Cargo.toml'), re.M | re.S)
          check('src-tauri/Cargo.toml [package]', m and m.group(1))
          for lock in ('Cargo.lock', 'src-tauri/Cargo.lock'):
              pkgs = re.findall(r'^name = "(dualfile[^"]*)"\nversion = "([^"]+)"', read(lock), re.M)
              if not pkgs:
                  errors.append(f'{lock}: no dualfile packages found')
              for name, found in pkgs:
                  check(f'{lock} {name}', found)
          # The npm package is intentionally unversioned (0.0.0); only keep both files in step.
          pkg = json.load(open('package.json'))['version']
          lock = json.load(open('package-lock.json'))
          if lock['version'] != pkg or lock['packages']['']['version'] != pkg:
              errors.append(f'package.json {pkg!r} and package-lock.json differ')
          # CHANGELOG section and src/release-notes.ts entry: one shared checker, also used by release-preflight.sh.
          import subprocess
          check = subprocess.run(['python3', 'scripts/check-release-notes.py', version], capture_output=True, text=True)
          if check.returncode != 0:
              errors += check.stdout.splitlines() + check.stderr.splitlines()
          if errors:
              print('\n'.join('::error::' + e for e in errors))
              sys.exit(1)
          print(f'OK: all versions, CHANGELOG and release notes are consistent for {version}')
          PY

  build:
    name: Build ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            appimagetool: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            sevenzip: https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-x64.tar.xz
            sevenzip_sha256: 2b539cf067b2ad48e1baa5093dbaa8818b73542d1222a0ffde9dc5f2922ea62e
          - arch: aarch64
            runner: ubuntu-22.04-arm
            appimagetool: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            sevenzip: https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-arm64.tar.xz
            sevenzip_sha256: edcc408aacce77da5223728f2eceb5e9f6dc713b8a9df934ad21e2a7f7560627
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-tauri
      OUTPUT_DIR: ${{ github.workspace }}/dist-appimage
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # No fixed Rust toolchain is declared by the source manifests.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file curl desktop-file-utils
      - run: npm ci
      - name: Download appimagetool for CI
        env:
          APPIMAGETOOL_URL: ${{ matrix.appimagetool }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
        run: |
          curl --fail --location --retry 3 "$APPIMAGETOOL_URL" -o "$RUNNER_TEMP/appimagetool"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
      # 7-Zip console build for RAR (LGPL + unRAR restriction, see docs/third-party-7zip.md).
      # Version 26.06 is pinned; bump URL and SHA-256 together and re-check the release page.
      - name: Download 7-Zip for RAR
        env:
          SEVENZIP_URL: ${{ matrix.sevenzip }}
          SEVENZIP_SHA256: ${{ matrix.sevenzip_sha256 }}
        run: |
          curl --fail --location --retry 3 "$SEVENZIP_URL" -o "$RUNNER_TEMP/7zip.tar.xz"
          echo "$SEVENZIP_SHA256  $RUNNER_TEMP/7zip.tar.xz" | sha256sum -c -
      - name: Build final AppImage and tarball
        env:
          ARCH: ${{ matrix.arch }}
          SEVENZIP_ARCHIVE: ${{ runner.temp }}/7zip.tar.xz
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/build-appimage.sh
      - name: Sign final AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          images=("$OUTPUT_DIR"/*.AppImage)
          if (( ${#images[@]} != 1 )); then
            echo 'Expected exactly one final AppImage.' >&2
            exit 1
          fi
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing key.' >&2; exit 1; }
          # Sign only after the AppDir has been repacked by build-appimage.sh.
          npx tauri signer sign --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "${images[0]}"
          test -s "${images[0]}.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ env.OUTPUT_DIR }}/*.AppImage
            ${{ env.OUTPUT_DIR }}/*.AppImage.sig
            ${{ env.OUTPUT_DIR }}/*.tar.gz

  assemble:
    needs: build
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to modify a published release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find(r => r.tag_name === process.env.RELEASE_TAG);
            if (existing && !existing.draft) {
              core.setFailed('This tag already has a published release; refusing to modify it.');
            }
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: assets-*
          merge-multiple: true
      - name: Generate updater manifest
        run: |
          python3 scripts/changelog-notes.py --version "$RELEASE_TAG" > release-notes.md
          shopt -s nullglob
          x86=(release-assets/*-x86_64.AppImage.sig)
          arm=(release-assets/*-aarch64.AppImage.sig)
          if (( ${#x86[@]} != 1 || ${#arm[@]} != 1 )); then
            echo 'Expected exactly one signature per architecture.' >&2
            exit 1
          fi
          python3 scripts/make-latest-json.py \
            --version "$RELEASE_TAG" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --signature "linux-x86_64=${x86[0]}" \
            --signature "linux-aarch64=${arm[0]}" \
            --notes-file release-notes.md \
            --output release-assets/latest.json
      - name: Generate checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Create or update draft only
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release-assets/*
