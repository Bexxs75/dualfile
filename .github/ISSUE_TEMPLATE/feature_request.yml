name: Feature request
description: Suggest an improvement to Dualfile.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: English or German is welcome. Describe your workflow.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
