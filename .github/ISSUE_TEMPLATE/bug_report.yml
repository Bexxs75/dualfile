name: Bug report
description: Report a reproducible problem in Dualfile.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'English or German is welcome. Remove private data from logs and screenshots. For vulnerabilities, use the Security policy.'
  - type: input
    id: version
    attributes:
      label: Dualfile version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux distribution, desktop and session
      description: Include distribution version, KDE/GNOME/other, Wayland/X11 and package format.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include local/archive/remote context and small non-private example data if relevant.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots (optional, sanitized)
